name: install scripts

# install.sh and install.ps1 download the published release, so they run
# against it: on every change to them, and whenever a release is published.

on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install-scripts.yml]
  pull_request:
    paths: [install.sh, install.ps1, .github/workflows/install-scripts.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install the latest release, piped into sh
        run: sh < install.sh
      - name: A new login shell finds wrongmemory on PATH
        run: |
          set -eu
          grep -q '# >>> wrongmemory >>>' "$HOME/.profile"
          found=$(env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '. "$HOME/.profile"; command -v wrongmemory')
          test "$found" = "$HOME/.local/share/wrongmemory/bin/wrongmemory"
      - name: Use the installed binaries
        run: |
          set -eu
          bin="$HOME/.local/share/wrongmemory/bin"
          "$bin/wrongmemory" --version
          "$bin/wrongmemoryd" --version
          mkdir -p "$RUNNER_TEMP/proj"
          project=$("$bin/wrongmemory" --json project add "$RUNNER_TEMP/proj" --managed | jq -r .project.projectId)
          "$bin/wrongmemory" --json remember "$project" "install.sh smoke on $RUNNER_OS" > /dev/null
          "$bin/wrongmemory" --json search "$project" "install smoke" | grep -q "install.sh smoke on $RUNNER_OS"
      - name: Update while the daemon runs; it is stopped and started again
        run: |
          set -eu
          bin="$HOME/.local/share/wrongmemory/bin"
          before=$("$bin/wrongmemory" --json daemon status | jq -r .pid)
          sh install.sh | tee "$RUNNER_TEMP/update.out"
          grep -q 'started again from the new binaries' "$RUNNER_TEMP/update.out"
          test -f "$bin/wrongmemoryd.old"
          after=$("$bin/wrongmemory" --json daemon status | jq -r .pid)
          test "$after" != "$before"
          project=$("$bin/wrongmemory" --json project list | jq -r '.projects[0].projectId')
          "$bin/wrongmemory" --json search "$project" "install smoke" | grep -q "install.sh smoke on $RUNNER_OS"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest release with Windows PowerShell 5.1, piped into Invoke-Expression
        shell: powershell
        run: |
          $env:WRONGMEMORY_NO_MODIFY_PATH = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
      - name: Use the installed binaries
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'WrongMemory\bin'
          & "$bin\wrongmemory.exe" --version
          & "$bin\wrongmemoryd.exe" --version
          $proj = Join-Path $env:RUNNER_TEMP 'proj'
          New-Item -ItemType Directory -Force $proj | Out-Null
          $project = (& "$bin\wrongmemory.exe" --json project add $proj --managed | ConvertFrom-Json).project.projectId
          & "$bin\wrongmemory.exe" --json remember $project "install.ps1 smoke on Windows" | Out-Null
          $hits = & "$bin\wrongmemory.exe" --json search $project "install smoke" | Out-String
          if ($hits -notmatch 'install.ps1 smoke on Windows') { throw 'search did not find the record' }
      - name: Update while the daemon runs, with PowerShell 7; it is stopped and started again
        shell: pwsh
        run: |
          $env:WRONGMEMORY_NO_MODIFY_PATH = '1'
          $bin = Join-Path $env:LOCALAPPDATA 'WrongMemory\bin'
          $before = (& "$bin\wrongmemory.exe" --json daemon status | ConvertFrom-Json).pid
          $out = ./install.ps1 6>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'started again from the new binaries') { throw 'the daemon was not restarted' }
          if (-not (Test-Path (Join-Path $bin 'wrongmemoryd.exe.old'))) { throw 'no rollback copy' }
          $after = (& "$bin\wrongmemory.exe" --json daemon status | ConvertFrom-Json).pid
          if ($after -eq $before) { throw 'the daemon still runs the old process' }
          $project = (& "$bin\wrongmemory.exe" --json project list | ConvertFrom-Json).projects[0].projectId
          $hits = & "$bin\wrongmemory.exe" --json search $project "install smoke" | Out-String
          if ($hits -notmatch 'install.ps1 smoke on Windows') { throw 'search after the update did not find the record' }

name: release

on:
  push:
    tags: ['v*']

# Least privilege: the build jobs (which run project code and Bun scripts)
# are read-only; only the publish job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          # The oldest supported Ubuntu runner, so the binaries need only the
          # glibc it ships (2.35).
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        run: bun scripts/release/package.ts
      - name: Check the platform's checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.platform }}
          # The archive and the two bare executables. The staging directory
          # (wrongmemory-<version>-<platform>/) and the per-platform
          # SHA256SUMS stay behind; publish writes one SHA256SUMS for all.
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/wrongmemory-${{ matrix.platform }}*
            dist/wrongmemoryd-${{ matrix.platform }}*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        shell: bash
        run: |
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          WrongMemory ${GITHUB_REF_NAME}, per-user: Windows x64, Linux x64 (glibc 2.35+), macOS arm64.

          - Binaries are **unsigned**: no Authenticode signature, no Apple notarization. Verify each archive or executable against SHA256SUMS and the GitHub build-provenance attestation:
            \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          - Install: unpack, then \`bin/wrongmemory install\` (\`bin\\wrongmemory.exe install\` on Windows). See docs/operations.md.
          - Scope and verification status: docs/status.md.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "WrongMemory $GITHUB_REF_NAME" --notes-file notes.md

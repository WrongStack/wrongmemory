name: release

on:
  push:
    tags: ['v*']

# Least privilege: the build job (which runs project code and Bun scripts)
# is read-only; only the publish job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        run: bun scripts/release/package.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          WrongMemory ${GITHUB_REF_NAME} (Windows x64, per-user).

          - Binaries are **unsigned** (no Authenticode signature). Verify the zip against SHA256SUMS and the GitHub build-provenance attestation:
            \`gh attestation verify <zip> --repo ${GITHUB_REPOSITORY}\`
          - Install: unzip, then \`bin\\wrongmemory.exe install\`. See docs/operations.md.
          - Scope and verification status: docs/status.md.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe dist/SHA256SUMS --draft --title "WrongMemory $GITHUB_REF_NAME" --notes-file notes.md

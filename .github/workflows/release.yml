name: release

on:
  push:
    tags: ['v*']

# Least privilege: the build jobs (which run project code and Bun scripts)
# are read-only; only the publish job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          # The oldest supported Ubuntu runner, so the binaries need no newer
          # glibc than it ships (2.35); v0.1.7 references up to GLIBC_2.34.
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        run: bun scripts/release/package.ts
      - name: Check the platform's checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.platform }}
          # The archive and the two bare executables. The staging directory
          # (wrongmemory-<version>-<platform>/) and the per-platform
          # SHA256SUMS stay behind; publish writes one SHA256SUMS for all.
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/wrongmemory-${{ matrix.platform }}*
            dist/wrongmemoryd-${{ matrix.platform }}*
            dist/install.*
            dist/install-desktop.ps1
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WRONGMEMORY_TEST_CLI: ${{ github.workspace }}/target/debug/wrongmemory.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Build disposable daemon fixtures
        run: cargo +1.93.0 build --locked -p wrongmemory-cli -p wrongmemoryd
      - name: Native format
        working-directory: apps/desktop
        run: cargo fmt --all -- --check
      - name: Native Clippy
        working-directory: apps/desktop
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native tests
        working-directory: apps/desktop
        run: cargo test --workspace --locked
      - name: Five consecutive native daemon runs
        working-directory: apps/desktop
        run: |
          for ($round = 1; $round -le 5; $round++) {
            cargo test --test daemon --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package regression tests
        run: bun run desktop:package:test
      - name: Package native Windows preview
        run: bun run desktop:package
      - name: Verify extracted binaries and packaged daemon IPC
        working-directory: apps/desktop
        run: |
          $proof = bun ../../scripts/desktop/verify.ts --out ../../dist-desktop --runtime | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WRONGMEMORY_TEST_CLI = Join-Path $proof.extracted 'bin/wrongmemory.exe'
          cargo test --test daemon --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun ../../scripts/desktop/install-smoke.ts --out ../../dist-desktop --bundle $proof.extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-desktop-windows-x64
          path: |
            dist-desktop/*.zip
            dist-desktop/wrongmemory-desktop-windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        shell: bash
        run: |
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          WrongMemory ${GITHUB_REF_NAME}, per-user: Windows x64, Linux x64 (glibc 2.34+), macOS arm64.

          - Binaries are **unsigned**: no Authenticode signature, no Apple notarization. Verify each archive or executable against SHA256SUMS and the GitHub build-provenance attestation:
            \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          - Install: unpack, then \`bin/wrongmemory install\` (\`bin\\wrongmemory.exe install\` on Windows). See docs/operations.md.
          - Scope and verification status: docs/status.md.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "WrongMemory $GITHUB_REF_NAME" --notes-file notes.md
